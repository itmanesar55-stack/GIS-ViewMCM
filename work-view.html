<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Details</title>
  <link rel="icon" href="mcm-logo.png">
  <style>
    :root { --ink: #17221f; --muted: #5b6770; --line: #dde3df; --bg: #f4f6f3; --card: #fff; --accent: #1469df; --green: #1e6b3a; --green-bg: #e6f4ea; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #17221f; color: #fff; }
    header img { width: 40px; height: 40px; border-radius: 50%; background: #fff; }
    header h1 { margin: 0; font-size: 16px; }
    header p { margin: 0; font-size: 12px; color: #cfe0d9; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar a, .toolbar button { min-height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: 600 13px inherit; font-family: inherit; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
    .asset-name { margin: 0 0 4px; font-size: 20px; }
    .asset-meta { color: var(--muted); font-size: 13px; }
    h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { width: 38%; color: var(--muted); font-weight: 600; font-size: 13px; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    td { word-break: break-word; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--green-bg); color: var(--green); }
    .pill.done { background: #eef0f2; color: var(--muted); }
    .work-list a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); color: var(--accent); text-decoration: none; }
    .work-list a:last-child { border-bottom: 0; }
    .work-list a:hover .work-title { text-decoration: underline; }
    .work-list a.selected { background: #eef5ff; border-radius: 6px; }
    .work-sub { display: block; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    .note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
    @media (max-width: 560px) { th { width: 44%; } .asset-name { font-size: 18px; } }
    @media print { .toolbar { display: none; } body { background: #fff; } .card { border: 0; padding: 0; } }
  </style>
  <script src="net-guard.js" defer></script>
</head>
<body>
  <header>
    <img src="mcm-logo.png" alt="">
    <div><h1>Municipal Corporation Manesar</h1><p>Public asset register — work details (view only)</p></div>
  </header>
  <main>
    <div class="toolbar">
      <button type="button" id="back-button">← Back to map</button>
      <button type="button" onclick="window.print()">Print / Save as PDF</button>
    </div>
    <div id="content"><div class="empty">Loading…</div></div>
    <p class="note">Information as published by Municipal Corporation Manesar. For corrections, contact the MCM office.</p>
  </main>
  <script>
    // Public, read-only view of an asset's works. Reads the published assets.geojson, so it works both on the
    // portal and on the public GitHub Pages viewer without a login. Private assets are never in that file.
    const CLASS_LABELS = {"RD": "Road", "DR": "Drain", "JN": "Junction", "MH": "Manhole", "FT": "Footpath", "IN": "Drain Inlet", "CT": "Cycle Track", "OF": "Drain Outfall", "CV": "Culvert", "SL": "Streetlight", "FP": "Feeder Pillar", "HM": "High Mast", "SG": "Signage", "TR": "Traffic Signal", "PK": "Park", "PT": "Public Toilet", "PB": "Public Building", "BS": "Bus Shelter", "PD": "Pond", "STP": "Sewage Treatment Plant", "BP": "Boosting Station", "WL": "Water Supply Line", "SD": "Storm Water Drain", "CD": "C&D Waste Site", "CG": "Cremation Ground", "GH": "Gaushala", "CC": "Community Center", "CP": "Chaupal", "SM": "Stadium", "BC": "Badminton Court", "AP": "Advertisement Pole Site", "SF": "Street Furniture", "TW": "Tubewell", "SW": "Sewer Line", "TWL": "Treated Water Line", "WT": "Water Tanker Supply", "WE": "Well", "RWH": "Rain Water Harvesting"};
    const WORK_FIELDS = [
      ['hewpId', 'HEWP ID'], ['workName', 'Work Name'], ['workCategory', 'Work Category'], ['componentWorked', 'Component / Structure'],
      ['workType', 'Type of Work'], ['workDescription', 'Work Description'], ['workLengthM', 'Length of Work Done (m)'], ['tankersHired', 'Number of Tankers Hired'], ['tankerCapacityL', 'Tanker Capacity (litres)'], ['tripsPerDay', 'Trips per Day'], ['ratePerTrip', 'Rate per Trip (Rs.)'], ['tenderId', 'Tender ID'], ['tenderName', 'Tender Name'],
      ['tenderDate', 'Tender Date'], ['estimatedAmount', 'Estimated Amount (Rs.)'], ['agencyName', 'Agency Name'], ['workOrderDate', 'Work Order Date'],
      ['agreementAmount', 'Agreement Amount (Rs.)'], ['workStartDate', 'Work Start Date'], ['completionDate', 'Final Completion Date'],
      ['actualExpenditure', 'Actual Expenditure (Rs.)'], ['timeExtension', 'Time Extension for Work'], ['extendedUpto', 'Extended Upto'],
      ['testingStatus', 'Testing Status'], ['dlpPeriod', 'DLP Period (months)'], ['dlpStartDate', 'DLP Start Date'], ['dlpEndDate', 'DLP End Date'],
      ['fundSource', 'Fund Source / Scheme'], ['remarks', 'Remarks'],
    ];
    const params = new URLSearchParams(location.search);
    const assetId = params.get('id') || '';
    const selectedWorkId = params.get('workId') || '';
    const content = document.getElementById('content');

    document.getElementById('back-button').addEventListener('click', () => {
      if (history.length > 1 && document.referrer) history.back(); else location.href = 'index.html';
    });
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function fmt(key, value) {
      if (/Date$|Upto$/.test(key) && /^\d{4}-\d{2}-\d{2}/.test(value)) { const d = new Date(value); if (!isNaN(d)) return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
      if (/Amount|Expenditure/.test(key) && /^\d+(\.\d+)?$/.test(String(value).trim())) return Number(value).toLocaleString('en-IN');
      return value;
    }
    function worksOf(p) {
      const works = [];
      if (p.workId) works.push({ ...(p.lifecycleData || {}), workId: p.workId, current: true });
      (Array.isArray(p.workHistory) ? p.workHistory : []).forEach(w => { if (w && w.workId) works.push({ ...w, current: false }); });
      return works;
    }
    const pill = w => '<span class="pill' + (w.current ? '' : ' done') + '">' + (w.current ? 'CURRENT' : 'COMPLETED') + '</span>';
    const link = w => '?id=' + encodeURIComponent(assetId) + '&workId=' + encodeURIComponent(w.workId);

    async function load() {
      let feature;
      try {
        const data = await fetch('assets.geojson', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
        feature = (data.features || []).find(f => f.properties && f.properties.assetId === assetId);
      } catch (error) {
        content.innerHTML = '<div class="card empty">Could not load the asset register (' + esc(error.message) + '). Please try again later.</div>';
        return;
      }
      if (!feature) { content.innerHTML = '<div class="card empty">Asset "' + esc(assetId) + '" was not found in the public register.</div>'; return; }
      const p = feature.properties;
      const works = worksOf(p);
      const work = selectedWorkId ? works.find(w => w.workId === selectedWorkId) : null;
      // "Save as PDF" names the file after the page title, so lead with the asset name.
      const titleName = String(p.assetName || '').trim().slice(0, 100);
      document.title = ((titleName ? titleName + ' - ' : '') + (work ? work.workId : p.assetId) + ' - Work Details').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ');

      const where = [p.ward && 'Ward ' + p.ward, p.sector, p.villageName || p.village].filter(Boolean).join(' · ');
      let html = '<div class="card"><h1 class="asset-name">' + esc(p.assetName || p.assetId) + '</h1>' +
        '<div class="asset-meta">' + esc(p.assetId) + ' · ' + esc(CLASS_LABELS[p.assetClass] || p.assetClass) + (where ? ' · ' + esc(where) : '') + (p.lengthM ? ' · ' + esc(Number(p.lengthM).toLocaleString('en-IN')) + ' m' : '') + '</div></div>';

      if (selectedWorkId && !work) html += '<div class="card empty">Work "' + esc(selectedWorkId) + '" was not found on this asset.</div>';
      if (work) {
        const rows = WORK_FIELDS.filter(([k]) => work[k] !== undefined && String(work[k]).trim() !== '')
          .map(([k, label]) => '<tr><th>' + esc(label) + '</th><td>' + esc(fmt(k, work[k])) + '</td></tr>').join('');
        html += '<div class="card"><h2>Work ' + esc(work.workId) + ' ' + pill(work) + '</h2>' +
          (rows ? '<table>' + rows + '</table>' : '<div class="empty">No details have been recorded for this work yet.</div>') + '</div>';
      }
      html += '<div class="card"><h2>' + (work ? 'All works on this asset' : 'Works on this asset') + ' (' + works.length + ')</h2>' +
        (works.length ? '<div class="work-list">' + works.map(w => '<a href="' + link(w) + '"' + (work && w.workId === work.workId ? ' class="selected"' : '') + '><span><span class="work-title">' + esc(w.workName || w.workId) + '</span>' +
          '<span class="work-sub">' + esc(w.workId) + (w.agencyName ? ' · ' + esc(w.agencyName) : '') + (w.completionDate ? ' · completed ' + esc(fmt('completionDate', w.completionDate)) : '') + '</span></span>' + pill(w) + '</a>').join('') + '</div>'
          : '<div class="empty">No work has been recorded on this asset yet.</div>') + '</div>';
      content.innerHTML = html;
    }
    load();
  </script>
</body>
</html>
