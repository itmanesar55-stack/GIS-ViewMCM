<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCM GIS Map - moved</title>
<meta http-equiv="refresh" content="3; url=https://gis.mcmanesar.in/index.html?public=1">
<link rel="canonical" href="https://gis.mcmanesar.in/index.html?public=1">
<style>
  :root { --ink:#17221f; --muted:#5f6b66; --bg:#f4f6f3; --card:#fff; --accent:#126b68; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:480px; background:var(--card); border-radius:10px; padding:28px 24px; box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
  img { width:84px; }
  h1 { font-size:20px; margin:14px 0 8px; }
  p { color:var(--muted); margin:0 0 18px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:10px 18px; border-radius:6px; font-weight:600; }
</style>
</head>
<body>
<main>
  <img src="mcm-logo.png" alt="Municipal Corporation Manesar">
  <h1>The MCM GIS map has moved</h1>
  <p>Municipal Corporation Manesar's public asset map is now at <b>gis.mcmanesar.in</b>. Taking you there&hellip;</p>
  <a class="btn" id="go" href="https://gis.mcmanesar.in/index.html?public=1">Open the GIS map</a>
</main>
<script>
  // Keep a shared asset link working: ...?view=<asset id> -> the same asset on the new site.
  var q = new URLSearchParams(location.search), url = 'https://gis.mcmanesar.in/index.html?public=1';
  if (q.get('view')) url += '&view=' + encodeURIComponent(q.get('view'));
  document.getElementById('go').href = url;
  setTimeout(function () { location.replace(url); }, 1500);
</script>
</body>
</html>
