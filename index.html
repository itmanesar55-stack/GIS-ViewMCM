<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map Viewer</title>

<!-- Leaflet (map library) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Omnivore: reads .kml files into Leaflet layers -->
<script src="https://cdn.jsdelivr.net/npm/@mapbox/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
  :root {
    --ink: #1b2430;
    --panel: #ffffff;
    --line: #dfe4ea;
    --muted: #6b7684;
    --accent: #2f6f4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  #map { position: absolute; inset: 0; z-index: 1; }

  /* Title bar */
  .titlebar {
    position: absolute; top: 14px; left: 14px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 2px 10px rgba(27,36,48,.12);
    max-width: 260px;
  }
  .titlebar h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  .titlebar p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  /* Loading / error notice */
  .notice {
    position: absolute; bottom: 18px; left: 14px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px;
    color: var(--muted); box-shadow: 0 2px 10px rgba(27,36,48,.12);
    max-width: 320px; display: none;
  }
  .leaflet-control-layers { border-radius: 10px !important; }
  .leaflet-control-layers-list { font-size: 13px; }
</style>
</head>
<body>

<div class="titlebar">
  <h1>Map Viewer</h1>
  <p>Toggle layers using the control in the top-right corner.</p>
</div>

<div id="map"></div>
<div class="notice" id="notice"></div>

<script>
/* =======================================================================
   1. LIST YOUR KML FILES HERE
   -----------------------------------------------------------------------
   - "file"  : the exact filename, uploaded next to this index.html
   - "name"  : the label shown in the layer control
   - "color" : line/marker colour for that layer
   - "show"  : true = visible on load, false = starts hidden
   Add or remove lines to match how many KML files you have.
   ======================================================================= */
const KML_LAYERS = [
  { file: "FINALMCM.kml", name: "Roads", color: "#e6194b", show: true },
];
/* ===================================================================== */

// Base map
const map = L.map("map", { center: [20, 0], zoom: 2 });

const streets = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }
).addTo(map);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "Imagery &copy; Esri" }
);

const baseMaps = { "Streets": streets, "Satellite": satellite };
const overlays = {};

const notice = document.getElementById("notice");
function showNotice(msg) { notice.textContent = msg; notice.style.display = "block"; }

let allBounds = null;
let loaded = 0;
const total = KML_LAYERS.length;

KML_LAYERS.forEach(function (cfg) {
  const style = { color: cfg.color, weight: 3, opacity: 0.9, fillColor: cfg.color, fillOpacity: 0.25 };

  const layer = omnivore.kml(cfg.file)
    .on("ready", function () {
      // colour every feature in this layer
      this.setStyle && this.setStyle(style);
      this.eachLayer(function (l) {
        if (l.setStyle) l.setStyle(style);
        if (l.feature && l.feature.properties && l.feature.properties.name) {
          l.bindPopup("<b>" + l.feature.properties.name + "</b>");
        }
      });
      // extend the combined bounds so we can zoom to everything
      try {
        const b = this.getBounds();
        if (b.isValid()) allBounds = allBounds ? allBounds.extend(b) : L.latLngBounds(b);
      } catch (e) {}
      finishOne();
    })
    .on("error", function () {
      showNotice("Could not load \"" + cfg.file + "\". Check the filename is exact and the file sits next to index.html.");
      finishOne();
    });

  overlays[cfg.name] = layer;
  if (cfg.show) layer.addTo(map);
});

function finishOne() {
  loaded++;
  if (loaded === total && allBounds && allBounds.isValid()) {
    map.fitBounds(allBounds, { padding: [40, 40] });
  }
}

L.control.layers(baseMaps, overlays, { collapsed: false }).addTo(map);
</script>
</body>
</html>
